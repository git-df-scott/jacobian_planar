name: Cloud math mailbox pings

on:
  push:
    branches: [mailbox/v2]
    paths: ['.math-mailbox/messages/**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Recovery also covers sends whose GitHub credential did not produce a push event.
# The repository variable is an explicit activation switch; absent means disabled.
concurrency:
  group: math-mailbox-relay
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  relay:
    if: >-
      vars.MATH_MAILBOX_ENABLED == 'true' &&
      (github.event_name != 'push' || startsWith(github.event.head_commit.message, '[mailbox] send '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deliver pending pings
        env:
          MATH_MAILBOX_REPO: ${{ github.repository }}
          MATH_MAILBOX_GITHUB_TOKEN: ${{ secrets.MATH_MAILBOX_GITHUB_TOKEN || github.token }}
          MATH_MAILBOX_CLAUDE_TRIGGER_TOKEN: ${{ secrets.MATH_MAILBOX_CLAUDE_TRIGGER_TOKEN }}
        run: python tools/math_mailbox/math_mailbox.py relay
